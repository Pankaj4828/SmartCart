# SmartCart AWS EKS observability
# Chart: kube-prometheus-stack 93.1.1

alertmanager:
  enabled: false

grafana:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200
      isDefault: false
      editable: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
