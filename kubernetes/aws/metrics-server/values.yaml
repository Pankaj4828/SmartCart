# Metrics Server configuration for SmartCart on AWS EKS.
# Chart: metrics-server 3.14.0
# Application: metrics-server 0.9.0

replicas: 1

apiService:
  create: true

hostNetwork:
  enabled: false

args:
  - --kubelet-insecure-tls=false

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 200m
    memory: 300Mi
