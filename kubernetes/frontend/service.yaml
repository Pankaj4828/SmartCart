# SmartCart Frontend Service.
#
# Provides a stable Kubernetes endpoint for the frontend Pods.
#
# The frontend is served by Nginx on port 80.
# This Service will later be used by the Ingress.

apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: smartcart

spec:
  # Keep the frontend internal for now.
  # Ingress will provide external access later.
  type: ClusterIP

  # Send traffic to frontend Pods.
  selector:
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: 80
