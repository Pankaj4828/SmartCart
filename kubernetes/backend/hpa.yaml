apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: smartcart

spec:
  # Keep at least one backend pod running.
  minReplicas: 1

  # Allow Kubernetes to scale the backend up to three pods.
  maxReplicas: 3

  # HPA manages the backend Deployment.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend

  # Scale based on average CPU utilization.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70