name: SmartCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend import
        run: python -c "from backend.app.main import app; print('Backend import OK')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Build the same backend image that we use in our local
      # Docker/Kubernetes environment.
      - name: Build backend image
        run: |
          docker build \
            -f docker/backend.Dockerfile \
            -t smartcart-backend:ci \
            .

      # Build the same frontend image that we use in our local
      # Docker/Kubernetes environment.
      - name: Build frontend image
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            -t smartcart-frontend:ci \
            .

      # Scan the backend image for known OS and Python-library
      # vulnerabilities.
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-backend:ci
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Scan the frontend image for known OS and Node/library
      # vulnerabilities.
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Preserve the security reports so we can inspect the
      # exact vulnerabilities when a scan fails.
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          retention-days: 30