name: SmartCart CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # 1. Backend validation
  # ============================================================

  backend:
    name: Backend Validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend import
        run: python -c "from backend.app.main import app; print('Backend import OK')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

      # --------------------------------------------------------
      # Audit Python dependencies for known vulnerabilities
      # --------------------------------------------------------

      #
      # pip-audit checks the versions declared in
      # backend/requirements.txt against known vulnerability
      # databases.
      #
      # If a vulnerable dependency is found, this step fails
      # and prevents the Docker stage from running.
      #

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r backend/requirements.txt


  # ============================================================
  # 2. Frontend validation
  # ============================================================

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # ============================================================
  # 3. Gitleaks secret scanning
  # ============================================================

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # 2. Scan repository files for secrets
      # --------------------------------------------------------

      #
      # We intentionally use "dir" instead of "git".
      #
      # dir scans the files currently present in the checkout.
      #
      # It does not scan our historical Git commits.
      #
      # .env is not committed because it is covered by .gitignore,
      # so it will not exist in the GitHub Actions checkout.
      #
      # Historical development credentials are therefore not part
      # of this CI gate.
      #

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            dir /repo \
            --redact \
            --exit-code 1


  # ============================================================
  # 4. Docker build, security scan and publishing
  # ============================================================

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-24.04

    # Docker images are built only after application validation
    # succeeds.

    needs:
      - backend
      - frontend
      - gitleaks

    permissions:
      contents: write
      security-events: write

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # 2. Run Semgrep SAST
      # --------------------------------------------------------

      #
      # Scan only SmartCart application source code.
      #
      # Docker/Kubernetes/Helm configuration is intentionally
      # excluded because those areas have separate security
      # controls in this project.
      #

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.179.0 \
            semgrep scan \
            --config=auto \
            /src/backend/app \
            /src/frontend/src


      # --------------------------------------------------------
      # 3. Set up Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # --------------------------------------------------------
      # 4. Build backend image
      # --------------------------------------------------------

      #
      # load: true
      #
      # Loads the built image into the runner's local Docker
      # engine so Trivy can scan it.
      #
      # push: false
      #
      # Do not publish the image yet.
      #
      # The image receives:
      #
      #   - local CI tag
      #   - latest tag
      #   - Git commit SHA tag
      #

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/backend.Dockerfile
          load: true
          push: false
          tags: |
            smartcart-backend:ci
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-backend:${{ github.sha }}


      # --------------------------------------------------------
      # 5. Build frontend image
      # --------------------------------------------------------

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          load: true
          push: false
          tags: |
            smartcart-frontend:ci
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # 6. Scan backend image with Trivy
      # --------------------------------------------------------

      #
      # continue-on-error allows the frontend scan to execute
      # even if the backend scan finds a problem.
      #
      # The final security gate below still fails the job.
      #

      - name: Scan backend image with Trivy
        id: backend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-backend:ci
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true

          # pip 26.2+ contains an embedded CycloneDX SBOM
          # describing pip's vendored dependencies.
          #
          # These are not SmartCart application dependencies.
          #
          # The actual SmartCart Python packages and Debian
          # OS packages continue to be scanned normally.

          skip-files: "**/pip/_vendor/bom.cdx.json"

          exit-code: 1


      # --------------------------------------------------------
      # 7. Upload backend Trivy report
      # --------------------------------------------------------

      - name: Upload backend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend


      # --------------------------------------------------------
      # 8. Scan frontend image with Trivy
      # --------------------------------------------------------

      - name: Scan frontend image with Trivy
        id: frontend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1


      # --------------------------------------------------------
      # 9. Upload frontend Trivy report
      # --------------------------------------------------------

      - name: Upload frontend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend


      # --------------------------------------------------------
      # 10. Preserve Trivy reports as CI artifacts
      # --------------------------------------------------------

      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          retention-days: 30


      # --------------------------------------------------------
      # 11. Security gate
      # --------------------------------------------------------

      #
      # Both Trivy scans must pass before images are published.
      #

      - name: Enforce security gate
        if: always()
        run: |
          if [ "${{ steps.backend_scan.outcome }}" != "success" ]; then
            echo "Backend image failed the Trivy security scan."
            exit 1
          fi

          if [ "${{ steps.frontend_scan.outcome }}" != "success" ]; then
            echo "Frontend image failed the Trivy security scan."
            exit 1
          fi

          echo "Trivy security scans passed."


      # --------------------------------------------------------
      # 12. Login to Docker Hub
      # --------------------------------------------------------

      #
      # This step runs only when the security gate succeeds.
      #

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # 13. Push backend image
      # --------------------------------------------------------

      #
      # Push the exact image that was already built and scanned.
      #

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-backend:${{ github.sha }}


      # --------------------------------------------------------
      # 14. Push frontend image
      # --------------------------------------------------------

      #
      # Push the exact image that was already built and scanned.
      #

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartcart-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # 15. Update Helm image tags
      # --------------------------------------------------------

      #
      # yq understands YAML structure.
      #
      # We update the Helm values only after:
      #
      #   1. Application validation passed
      #   2. Security scans passed
      #   3. Docker images were successfully pushed
      #
      # The Git commit SHA is used as the immutable image tag.
      #

      - name: Update backend Helm image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.backend.image.repository = "${{ secrets.DOCKERHUB_USERNAME }}/smartcart-backend" | .backend.image.tag = "${{ github.sha }}"' helm/smartcart/values.yaml


      - name: Update frontend Helm image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.frontend.image.repository = "${{ secrets.DOCKERHUB_USERNAME }}/smartcart-frontend" | .frontend.image.tag = "${{ github.sha }}"' helm/smartcart/values.yaml


      # --------------------------------------------------------
      # 16. Show updated Helm values
      # --------------------------------------------------------

      - name: Show updated Helm values
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Updated Helm values:"
          cat helm/smartcart/values.yaml


      # --------------------------------------------------------
      # 17. Commit GitOps update
      # --------------------------------------------------------

      #
      # Commit the new image version back to GitHub.
      #
      # Argo CD will later detect this Git change and deploy
      # the new image to Kubernetes.
      #

      - name: Commit GitOps update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/smartcart/values.yaml

          git commit -m "chore: update image to ${GITHUB_SHA} [skip ci]" || exit 0

          git push