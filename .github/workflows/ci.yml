name: SmartCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend import
        run: python -c "from backend.app.main import app; print('Backend import OK')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-24.04

    # Build and scan Docker images only after the
    # application validation jobs have passed.
    needs:
      - backend
      - frontend

    # Required to upload SARIF security results to GitHub.
    permissions:
      contents: read
      security-events: write

    steps:
      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # 2. Build backend Docker image
      # --------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -f docker/backend.Dockerfile \
            -t smartcart-backend:ci \
            .

      # --------------------------------------------------------
      # 3. Build frontend Docker image
      # --------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            -t smartcart-frontend:ci \
            .

      # --------------------------------------------------------
      # 4. Scan backend image with Trivy
      # --------------------------------------------------------
      #
      # continue-on-error allows the workflow to continue so
      # that the frontend image is also scanned.
      #
      # We do NOT ignore the failure permanently.
      # The final security gate below will fail the job if
      # this scan reports HIGH/CRITICAL vulnerabilities.
      #
      - name: Scan backend image with Trivy
        id: backend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-backend:ci
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # --------------------------------------------------------
      # 5. Upload backend Trivy report
      # --------------------------------------------------------
      #
      # The report is uploaded even when the scan finds
      # vulnerabilities.
      #
      - name: Upload backend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # --------------------------------------------------------
      # 6. Scan frontend image with Trivy
      # --------------------------------------------------------
      #
      # This will now execute even if the backend scan failed.
      #
      - name: Scan frontend image with Trivy
        id: frontend_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # --------------------------------------------------------
      # 7. Upload frontend Trivy report
      # --------------------------------------------------------
      - name: Upload frontend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # --------------------------------------------------------
      # 8. Preserve Trivy reports as CI artifacts
      # --------------------------------------------------------
      #
      # These files are useful when troubleshooting a failed
      # security scan.
      #
      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          retention-days: 30

      # --------------------------------------------------------
      # 9. Final security gate
      # --------------------------------------------------------
      #
      # continue-on-error above allowed both scans to execute.
      # Now we explicitly fail the job if either scan failed.
      #
      - name: Enforce security gate
        if: always()
        run: |
          if [ "${{ steps.backend_scan.outcome }}" != "success" ]; then
            echo "Backend image failed the Trivy security scan."
            exit 1
          fi

          if [ "${{ steps.frontend_scan.outcome }}" != "success" ]; then
            echo "Frontend image failed the Trivy security scan."
            exit 1
          fi

          echo "Trivy security scans passed."