name: SmartCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend import
        run: python -c "from backend.app.main import app; print('Backend import OK')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t smartcart-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t smartcart-frontend:ci .