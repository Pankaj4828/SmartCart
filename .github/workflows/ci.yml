name: SmartCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: smartcart
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify backend import
        run: python -c "from backend.app.main import app; print('Backend import OK')"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-24.04

    # Docker builds happen only after application validation succeeds.
    needs:
      - backend
      - frontend

    # Required for uploading Trivy SARIF results
    # to GitHub Code Scanning / Security.
    permissions:
      contents: read
      security-events: write

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v7
      # This uses the same Dockerfile that we use locally
      # and in our Kubernetes deployment.
      #
      # :ci is intentionally used because this image is only
      # being validated here. We are NOT pushing it to a
      # registry yet.
      #
      - name: Build backend image
        run: |
          docker build \
            -f docker/backend.Dockerfile \
            -t smartcart-backend:ci \
            .

      # Again, this is the same Dockerfile used by our project.
      #
      - name: Build frontend image
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            -t smartcart-frontend:ci \
            .

      # Trivy checks:
      #   - OS packages
      #   - Python/application libraries
      #
      # HIGH and CRITICAL vulnerabilities with an available
      # fix will fail this CI job.
      #
      # SARIF is generated so GitHub can display the findings
      # in the Security / Code Scanning area.
      #
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-backend:ci
          format: sarif
          output: trivy-backend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # always() is important here.
      #
      # If Trivy finds a vulnerability and exits with code 1,
      # the scan step fails. We still want the SARIF report
      # uploaded so we can inspect the vulnerability.
      #
      - name: Upload backend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif

      # The frontend image is also scanned for OS and
      # application/library vulnerabilities.
      #
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: smartcart-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Upload even if the Trivy scan fails.
      #
      - name: Upload frontend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif

      # This gives us a downloadable copy of the reports
      # in the GitHub Actions run.
      #
      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
          retention-days: 30