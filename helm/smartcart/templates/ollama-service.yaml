# SmartCart Ollama Service.
#
# Based on the working Kubernetes Service:
# kubernetes/ollama/service.yaml
#
# Backend connects using:
# http://ollama:11434

apiVersion: v1
kind: Service

metadata:
  name: ollama

spec:
  # Ollama only needs to be accessible inside the cluster.
  type: ClusterIP

  selector:
    app: ollama

  ports:
    - name: http
      port: 11434
      targetPort: 11434
