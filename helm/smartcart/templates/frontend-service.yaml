# SmartCart Frontend Service.
#
# Based on the working Kubernetes Service:
# kubernetes/frontend/service.yaml
#
# Provides a stable internal Kubernetes endpoint
# for the frontend Pods.

apiVersion: v1
kind: Service

metadata:
  name: frontend

spec:
  # Keep the frontend internal.
  # Ingress provides external access.
  type: ClusterIP

  # Send traffic to frontend Pods.
  selector:
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: 80
