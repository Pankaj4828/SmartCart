
# Authentication configuration for Vault Secrets Operator.
#
# VSO uses the SmartCart ServiceAccount to authenticate
# against Vault's Kubernetes authentication method.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth

metadata:
  name: smartcart

spec:
  # Use the VaultConnection defined above.
  vaultConnectionRef: vault

  # Authenticate using Kubernetes ServiceAccount tokens.
  method: kubernetes

  # Vault Kubernetes authentication mount.
  mount: kubernetes

  kubernetes:
    # Select the Vault role through Helm values.
    role: {{ .Values.vault.role | quote }}

    # ServiceAccount used for Vault authentication.
    serviceAccount: smartcart-vault
