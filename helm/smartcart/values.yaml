# Default values for the SmartCart Helm chart.

backend:
  image:
    repository: pankajbehera/smartcart-backend
    tag: "95ca624d02014eb3ece24fa5d4217f9069bc9417"
  replicas: 1
frontend:
  image:
    repository: pankajbehera/smartcart-frontend
    tag: "95ca624d02014eb3ece24fa5d4217f9069bc9417"
  replicas: 1
ollama:
  image:
    repository: ollama/ollama
    tag: latest
  replicas: 1
postgres:
  image:
    repository: postgres
    tag: "17-alpine"
  storage: 2Gi
  storageClassName: standard
hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuTarget: 70
ollamaStorage: 5Gi
ollamaStorageClassName: standard
ingress:
  enabled: true
  className: nginx
  host: smartcart-helm.local
  proxyReadTimeout: "180"
  proxySendTimeout: "180"
# Vault authentication configuration
vault:
  address: http://vault.vault.svc:8200
  role: smartcart-helm
