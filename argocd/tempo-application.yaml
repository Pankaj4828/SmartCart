apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.2.1
      helm:
        releaseName: tempo
        valueFiles:
          - $values/kubernetes/aws/tempo/values.yaml
    - repoURL: https://github.com/Pankaj4828/SmartCart.git
      targetRevision: terra-aws
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tempo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
