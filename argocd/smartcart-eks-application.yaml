apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartcart-eks
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pankaj4828/SmartCart.git
    targetRevision: terra-aws
    path: helm/smartcart
    helm:
      valueFiles:
        - values-aws.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: smartcart-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true